[tool.poetry]
name = "smart-image-studio-backend"
version = "0.1.0"
description = ""
authors = []
package-mode = false

[tool.poetry.dependencies]
python = "^3.13"
fastapi = ">=0.115,<1.0"
uvicorn = {extras = ["standard"], version = ">=0.30,<1.0"}
python-multipart = ">=0.0.9,<1.0"
pillow = ">=10.4,<13.0"
opencv-python = ">=4.10,<5.0"
numpy = ">=1.26,<3.0"
pydantic-settings = ">=2.4,<3.0"
rapidocr = ">=3.0,<4.0"
onnxruntime = ">=1.18,<3.0"
openai = ">=1.66,<2.0"
sqlalchemy = ">=2.0,<3.0"
psycopg = {extras = ["binary"], version = ">=3.2,<4.0"}
alembic = ">=1.13,<2.0"

[tool.poetry.group.dev.dependencies]
ruff = "*"
mypy = "*"
pytest = "*"
pytest-asyncio = "*"
httpx = "*"
taskipy = "*"
testcontainers = {extras = ["postgres"], version = ">=4.0,<5.0"}

[tool.taskipy.tasks]
dev = "PYTHONPATH=src uvicorn app.main:app --reload --port 8000"
format = "ruff format src/app/"
lint = "ruff check src/app/"
typecheck = "mypy src/app/"
test = "pytest"
export-openapi = "PYTHONPATH=src python scripts/export_openapi.py > ../docs/openapi.json"

[tool.ruff]
line-length = 140
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.13"
strict = false
ignore_missing_imports = true
mypy_path = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
asyncio_mode = "auto"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
